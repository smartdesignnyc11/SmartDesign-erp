<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clients: Proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="../job-structure/Main.dc.html" aria-label="Open the menu" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </a>
      <b style="flex: 1; font-size: 19px">Clients</b>
      <button type="button" aria-label="Search clients and people" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a4866; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="New client" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a4866; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">5 clients · owed to us $92,265, none past due</span>
  </div>

  <div style="display: flex; gap: 8px; padding: 14px 16px 4px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">{{c.label}}<span style="font-weight: 700">{{c.n}}</span></button>
    </sc-for>
  </div>
  <span style="padding: 6px 16px 10px; font-size: 13px; color: #5b6578; line-height: 1.4">{{lead}}</span>

  <div style="margin: 0 16px; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="padding: 12px 14px; border-top: {{r.line}}; display: flex; flex-direction: column; gap: 8px">
        <a href="{{r.href}}" style="display: flex; flex-direction: column; gap: 3px; text-decoration: none; color: #172033">
          <span style="display: flex; gap: 8px; align-items: baseline"><b style="flex: 1; font-size: 15px">{{r.name}}</b><span style="font-size: 13px; font-weight: 600; color: #172033">{{r.money}}</span></span>
          <span style="font-size: 13px; color: #5b6578; line-height: 1.4">{{r.sub}}</span>
          <sc-if value="{{r.hasWait}}" hint-placeholder-val="{{true}}"><span style="font-size: 13px; line-height: 1.4; color: #b91c1c; font-weight: 600">{{r.wait}}</span></sc-if>
        </a>
        <sc-if value="{{r.primary}}" hint-placeholder-val="{{false}}">
          <button type="button" style="min-height: 48px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; font: inherit; font-size: 15px; font-weight: 700">{{r.act}}</button>
        </sc-if>
        <sc-if value="{{r.side}}" hint-placeholder-val="{{false}}">
          <div style="display: flex"><button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; color: #172033; font: inherit; font-size: 14px; font-weight: 600">{{r.act}}</button></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="height: 24px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'need' }; }
  renderVals() {
    const C = {
      klein: { name: 'Sarah & David Klein', money: 'owes $68,265', href: 'Client.dc.html', sub: '121 State Street, 14% done · INV-2026-038 due 9/15', wait: 'Sarah’s 9/2 mail (alteration agreement, COI, scope) and the agent’s call about Friday’s delivery wait on us', act: 'Reply to Sarah' },
      aliya: { name: 'Aliya Chen', money: '', href: '#', sub: '374 Washington Avenue · not on file as a client', wait: 'Her 8/30 mail has no answer, 4 days', act: 'Add Her as a Client' },
      jessop: { name: 'Jessop family', money: 'owes $24,000', href: '#', sub: '140 Prospect Place, design · design retainer sent 9/3, due 9/15', wait: '', act: '' },
      rivera: { name: 'Rivera family', money: '', href: '#', sub: '45 Cranberry St, design · $21,350 recorded as paid, not seen at the bank', wait: '', act: '' },
      lind: { name: 'The Lindqvists', money: '', href: '#', sub: '145 Hicks St · deal: Design Proposal, $420,000 · design proposal due today', wait: '', act: '' },
      naka: { name: 'Tom & Lily Nakamura', money: '', href: '#', sub: '200 E 66th St 9G · signed 7/25, $210,000 · no job set up yet', wait: '', act: '' }
    };
    const P = [
      { name: 'David Kahn, Kahn Architecture', money: '$210,000 won', href: '#', sub: 'Architect · 2 leads, 1 won · last touch 5/16', wait: 'A thank-you is owed', act: 'Send a Thank-You' },
      { name: 'Elena Ross, Compass', money: '', href: '#', sub: 'Broker · 1 lead · last touch 7/25', wait: '', act: '' },
      { name: 'Maria Orsini, Orsini Management', money: '', href: '#', sub: 'Managing agent · 1 lead · never touched', wait: '', act: '' }
    ];
    const T = this.state.tab;
    const L = { need: [C.klein, C.aliya], all: [C.klein, C.jessop, C.rivera, C.lind, C.naka], partners: P }[T];
    const rows = L.map((r, i) => Object.assign({}, r, { line: i ? '1px solid #eef1f6' : '0', hasWait: !!r.wait, primary: T === 'need' && i === 0, side: !!r.act && !(T === 'need' && i === 0) }));
    const defs = [{ id: 'need', label: 'Need You', n: 2 }, { id: 'all', label: 'All', n: '' }, { id: 'partners', label: 'Partners', n: '' }];
    const chips = defs.map((c) => Object.assign({}, c, {
      pressed: T === c.id ? 'true' : 'false', bg: T === c.id ? '#172033' : '#fff', color: T === c.id ? '#fff' : '#172033', border: T === c.id ? '#172033' : '#c9d1e0',
      pick: () => this.setState({ tab: c.id })
    }));
    const lead = { need: 'A client waiting on us, money past due, or someone writing as a client who is not on file.', all: 'Every client, with their job, what they owe and what is next.', partners: 'The architects, brokers and managing agents who send us work, and what we owe them.' }[T];
    return { chips, rows, lead };
  }
}
</script>
</body>
</html>
