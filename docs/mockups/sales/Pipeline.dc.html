<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline: Proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; min-height: 1200px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="../job-structure/Main.dc.html" aria-label="Open the menu" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </a>
      <b style="flex: 1; font-size: 19px">Pipeline</b>
      <button type="button" onClick="{{toggleNew}}" aria-expanded="{{newExpanded}}" aria-label="New lead" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a4866; background: {{newBg}}; color: #fff; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">6 open · $1.3M · weighted $686K · every pipeline</span>
  </div>
  <sc-if value="{{newOpen}}" hint-placeholder-val="{{false}}">
    <div role="menu" style="margin: 12px 16px 0; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; box-shadow: 0 12px 32px rgba(17,26,46,.16); padding: 6px; display: flex; flex-direction: column">
      <span style="padding: 8px 12px 4px; font-size: 12px; color: #5b6578">New</span>
      <a href="#" role="menuitem" style="display: flex; flex-direction: column; justify-content: center; min-height: 52px; padding: 0 12px; border-radius: 8px; color: #172033; text-decoration: none"><b style="font-size: 15px">Lead from a Mail</b><span style="font-size: 12px; color: #5b6578">Filled from the inquiry, with the duplicate check shown</span></a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; min-height: 48px; padding: 0 12px; border-radius: 8px; color: #172033; text-decoration: none; font-size: 15px; font-weight: 600">Lead, Typed In</a>
    </div>
  </sc-if>

  <div style="display: flex; gap: 8px; padding: 14px 16px 4px">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">{{c.label}}<span style="font-weight: 700">{{c.n}}</span></button>
    </sc-for>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column">
      <div style="padding: 12px 16px 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #5b6578; display: flex; gap: 6px"><span>{{g.title}}</span><span>{{g.n}}</span></div>
      <div style="margin: 0 16px; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <div style="padding: 12px 14px; border-top: {{r.line}}; display: flex; flex-direction: column; gap: 8px">
            <a href="Deal.dc.html" style="display: flex; flex-direction: column; gap: 3px; text-decoration: none; color: #172033">
              <span style="display: flex; gap: 8px; align-items: baseline"><b style="flex: 1; font-size: 15px">{{r.name}}</b><b style="font-size: 15px">{{r.value}}</b></span>
              <span style="font-size: 12px; font-weight: 700; color: #5b6578">{{r.stage}}</span>
              <span style="font-size: 13px; color: #5b6578; line-height: 1.4"><span style="color: {{r.tone}}; font-weight: 600">{{r.when}}</span> · {{r.next}}</span>
            </a>
            <sc-if value="{{r.primary}}" hint-placeholder-val="{{false}}">
              <button type="button" style="min-height: 48px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; font: inherit; font-size: 15px; font-weight: 700">{{r.act}}</button>
            </sc-if>
            <sc-if value="{{r.side}}" hint-placeholder-val="{{true}}">
              <div style="display: flex"><button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; color: #172033; font: inherit; font-size: 14px; font-weight: 600">{{r.act}}</button></div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="margin: 16px 16px 0; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
    <button type="button" onClick="{{toggleNums}}" aria-expanded="{{numsExpanded}}" style="width: 100%; min-height: 52px; padding: 0 14px; border: 0; background: transparent; font: inherit; color: #172033; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left">
      <b style="flex: 1; font-size: 15px">How Sales Is Going</b>
      <span style="font-size: 13px; color: #5b6578">this quarter</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8a94a8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{numsChevron}}"></path></svg>
    </button>
    <sc-if value="{{numsOpen}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{nums}}" as="n" hint-placeholder-count="6">
          <div style="display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-top: 1px solid #eef1f6">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{n.k}}</span><span style="font-size: 12px; color: #5b6578; line-height: 1.35">{{n.sub}}</span></span>
            <b style="font-size: 15px">{{n.v}}</b>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <div style="height: 24px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'need', nums: false, newOpen: false }; }
  renderVals() {
    const RED = '#b91c1c', MUTE = '#5b6578';
    const need = [
      { name: 'Priya Raman', value: '$185,000', stage: 'SITE VISIT · broker referral', when: '2 days late', tone: RED, next: 'Send the recap with the range', act: 'Draft the Recap' },
      { name: 'Daniel Okafor', value: '$95,000', stage: 'LEAD · website · 11 Riverside Dr 4A, co-op', when: '2 days late', tone: RED, next: 'Call back about timing; just closed on the apartment', act: 'Call' },
      { name: 'Marcus Bell', value: '$140,000', stage: 'PROPOSAL OUT · Houzz · 77 Bleecker St 3F', when: 'Quiet 14 days', tone: RED, next: 'Proposal emailed 8/20, one option; nothing since', act: 'Follow Up' }
    ];
    const rest = [
      { name: 'The Lindqvists', value: '$420,000', stage: 'DESIGN AGREEMENT · architect referral · 145 Hicks St', when: 'Fri 9/4', tone: MUTE, next: 'Walk the house with the architect', act: 'Open' },
      { name: 'Ana Petrova', value: '$260,000', stage: 'PROPOSAL OUT · repeat client · 30 E 85th St 12C', when: 'Fri 9/4', tone: MUTE, next: 'Answer the board’s three questions; board approval 10/18', act: 'Open' },
      { name: 'Sofia Adler', value: '$160,000', stage: 'QUALIFIED · managing agent referral', when: 'Sat 9/5', tone: MUTE, next: 'Book the site visit at 70 Remsen', act: 'Open' }
    ];
    const closed = [
      { name: 'Tom & Lily Nakamura', value: '$210,000', stage: 'WON · architect referral · 200 E 66th St 9G', when: 'Signed 7/25', tone: MUTE, next: 'Client on file; no job set up on the record yet', act: 'Set Up the Job' },
      { name: 'Owen Marsh', value: '$110,000', stage: 'LOST 8/3 · past-client referral', when: 'Lost after the proposal', tone: MUTE, next: 'No reason recorded: ask why while it is fresh', act: 'Record the Reason' }
    ];
    const T = this.state.tab;
    const prep = (rows, blueFirst) => rows.map((r, i) => Object.assign({}, r, { line: i ? '1px solid #eef1f6' : '0', primary: blueFirst && i === 0, side: !(blueFirst && i === 0) }));
    const G = {
      need: [{ title: 'Need You', n: 3, rows: prep(need, true) }, { title: 'On Track', n: 3, rows: prep(rest, false) }],
      open: [{ title: 'All Open, by Stage', n: 6, rows: prep([need[1], rest[2], need[0], rest[0], need[2], rest[1]], false) }],
      closed: [{ title: 'Won and Lost This Quarter', n: 2, rows: prep(closed, false) }]
    };
    const defs = [{ id: 'need', label: 'Need You', n: 3 }, { id: 'open', label: 'All Open', n: '' }, { id: 'closed', label: 'Won and Lost', n: '' }];
    const chips = defs.map((c) => Object.assign({}, c, {
      pressed: T === c.id ? 'true' : 'false', bg: T === c.id ? '#172033' : '#fff', color: T === c.id ? '#fff' : '#172033', border: T === c.id ? '#172033' : '#c9d1e0',
      pick: () => this.setState({ tab: c.id })
    }));
    const nums = [
      { k: 'First Reply', sub: 'Median across 7 leads; the firms that win reply inside the hour', v: '3 h' },
      { k: 'Proposals Out', sub: 'Marcus Bell $140,000 · Ana Petrova $260,000', v: '$400,000' },
      { k: 'Signed This Quarter', sub: 'The Nakamuras, signed 7/25 (a handwritten note at signing)', v: '$210,000' },
      { k: 'Close Rate on Presented Proposals', sub: '1 won, 1 lost', v: '50%' },
      { k: 'Inquiry to Agreement', sub: 'The one job won this quarter', v: '48 days' },
      { k: 'Thank-Yous Owed to Partners', sub: 'David Kahn sent us work and heard nothing back', v: '1' }
    ];
    const numsOpen = !!this.state.nums, newOpen = !!this.state.newOpen;
    return {
      chips, groups: G[T], nums, numsOpen, numsExpanded: numsOpen ? 'true' : 'false', numsChevron: numsOpen ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      toggleNums: () => this.setState({ nums: !numsOpen }),
      newOpen, newExpanded: newOpen ? 'true' : 'false', newBg: newOpen ? '#2a3a5e' : 'transparent', toggleNew: () => this.setState({ newOpen: !newOpen })
    };
  }
}
</script>
</body>
</html>
