<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals on 121 State</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Job.dc.html" aria-label="Back to 121 State Street" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <b style="font-size: 19px">Approvals</b>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">121 State Street · 3 waiting on you</span>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{items}}" as="a" hint-placeholder-count="3">
      <div style="background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5b6578">{{a.kind}}</span>
        <div style="display: flex; align-items: baseline; gap: 8px"><b style="flex: 1; font-size: 15px; line-height: 1.35">{{a.title}}</b><b style="font-size: 15px">{{a.amt}}</b></div>
        <span style="font-size: 13px; color: #5b6578; line-height: 1.4">{{a.why}}</span>
        <div style="display: flex; gap: 8px; margin-top: 6px">
          <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; color: #172033; font: inherit; font-size: 14px; font-weight: 600">Review</button>
        </div>
      </div>
    </sc-for>
    <a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; color: #1d4ed8; text-decoration: none">All approvals, every job</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { kind: 'Bill · paid before approval', title: 'Window Works WW-2026-118', amt: '$33,500', why: '$3,800 over PO-2026-044. Approve the order amount and dispute the rest.' },
      { kind: 'Bill · held', title: 'AMP-311 plumbing sub', amt: '$9,800', why: 'No PO behind it. The PM was asked to confirm the work.' },
      { kind: 'Payroll · this job’s share', title: 'Crew hours 8/17 to 8/28', amt: '$4,210', why: 'Part of the $16,040 run, due 9/1.' }
    ] };
  }
}
</script>
</body>
</html>
