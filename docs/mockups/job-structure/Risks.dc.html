<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>At Risk on 121 State</title>

<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Job.dc.html" aria-label="Back to 121 State Street" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <b style="font-size: 19px">At Risk</b>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">121 State Street · 4 items, most urgent first</span>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{risks}}" as="r" hint-placeholder-count="4">
      <div style="background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 8px; align-items: center">
          <span style="font-size: 12px; font-weight: 700; color: {{r.tone}}">{{r.kind}}</span>
          <span style="font-size: 12px; color: #5b6578">· {{r.when}}</span>
        </div>
        <b style="font-size: 15px; line-height: 1.35">{{r.title}}</b>
        <span style="font-size: 13px; color: #5b6578; line-height: 1.4">{{r.why}}</span>
        <div style="display: flex; gap: 8px; margin-top: 6px">
          <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; color: #172033; font: inherit; font-size: 14px; font-weight: 600">{{r.act}}</button>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { risks: [
      { kind: 'Decision', tone: '#b91c1c', when: 'overdue since 8/31', title: 'Garden bedroom framing layout', why: 'Blocking framing. Waiting on the architect.', act: 'Get an Answer' },
      { kind: 'Decision', tone: '#b91c1c', when: 'overdue since 9/2', title: '2nd floor bathroom finishes', why: 'Blocking rough plumbing. Waiting on the Kleins.', act: 'Ask the Kleins' },

      { kind: 'Order', tone: '#b45309', when: 'needed 9/11', title: 'Insulation', why: 'Promised 9/16, five days after it is needed on site.', act: 'Expedite' }
    ] };
  }
}
</script>
</body>
</html>
