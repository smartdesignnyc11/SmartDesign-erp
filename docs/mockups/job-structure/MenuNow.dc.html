<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu: Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#93c5fd}a:hover{color:#bfdbfe}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111a2e; color: #e5e9f2; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">S</div>
    <div style="display: flex; flex-direction: column"><b style="font-size: 16px">SmartDesigns</b><span style="font-size: 12px; color: #9aa6bd">Projects</span></div>
  </div>
  <div style="display: flex; margin: 0 16px 12px; background: #0b1222; border: 1px solid #2a3550; border-radius: 10px; overflow: hidden">
    <span style="flex: 1; height: 40px; background: #2a3550; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">SmartDesign</span>
    <span style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #c5cde0">Mercer &amp; Bond</span>
  </div>
  <div style="flex: 1; padding: 0 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="16">
      <div style="display: flex; align-items: center; gap: 12px; min-height: {{r.h}}; padding: 0 12px 0 {{r.pad}}; border-radius: 10px; background: {{r.bg}}; font-size: {{r.fs}}; font-weight: {{r.fw}}">
        <span style="flex: 1">{{r.label}}</span>
        <sc-if value="{{r.hasCount}}" hint-placeholder-val="{{true}}"><span style="font-size: 13px; color: #c5cde0">{{r.count}}</span></sc-if>
        <sc-if value="{{r.chev}}" hint-placeholder-val="{{true}}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#c5cde0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </sc-if>
        <sc-if value="{{r.dup}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; color: #111a2e; background: #fbbf24; border-radius: 6px; padding: 2px 6px">Twice</span></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const R = (label, count, chev, o) => Object.assign({ label, count: count || '', hasCount: !!count, chev: !!chev, dup: false, h: '44px', pad: '12px', bg: 'transparent', fs: '16px', fw: '500' }, o || {});
    const rows = [
      R('Today', 6, true, { bg: '#22304d', fw: '700' }),
      R('Today', 0, false, { pad: '48px', fs: '15px' }),
      R('Approvals', 0, false, { pad: '48px', fs: '15px' }),
      R('Tasks', 0, false, { pad: '48px', fs: '15px', dup: true }),
      R('Tasks', 12, false, { dup: true }),
      R('Messages', 1),
      R('Projects', 2, true),
      R('Accounting', 6, true),
      R('Sales', 4, true),
      R('Clients'),
      R('Purchasing', 17, true),
      R('Design', 2, true),
      R('Company', 6, true),
      R('Reports', 0, true),
      R('More', 0, true),
      R('Settings', 0, true)
    ];
    return { rows };
  }
}
</script>
</body>
</html>
