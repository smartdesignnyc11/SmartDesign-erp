<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Job.dc.html" aria-label="Back to 121 State Street" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <b style="font-size: 19px">Site</b>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">121 State Street · what is happening on site</span>
  </div>

  <div style="padding: 16px 16px 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #5b6578">Questions from the Crew · 2 open</div>
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
    <sc-for list="{{questions}}" as="q" hint-placeholder-count="2">
      <div style="background: #fff; border: 1px solid #fde68a; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px">
        <span style="font-size: 12px; font-weight: 700; color: #5b6578">{{q.from}} · {{q.when}}</span>
        <b style="font-size: 15px; line-height: 1.35">{{q.text}}</b>
        <div style="display: flex; gap: 8px; margin-top: 4px">
          <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: #172033">Answer</button>
          <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: #172033">{{q.act}}</button>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 18px 16px 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #5b6578">Today on Site · Thu, Sep 3</div>
  <div style="margin: 0 16px; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
    <sc-for list="{{today}}" as="t" hint-placeholder-count="4">
      <div style="padding: 10px 14px; border-top: {{t.line}}; display: flex; gap: 10px">
        <span style="width: 78px; flex: none; font-size: 13px; color: #5b6578">{{t.k}}</span>
        <span style="font-size: 14px; line-height: 1.4">{{t.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 18px 16px 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #5b6578">Coming to Site</div>
  <div style="margin: 0 16px 24px; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
    <sc-for list="{{coming}}" as="c" hint-placeholder-count="3">
      <div style="padding: 10px 14px; border-top: {{c.line}}; display: flex; gap: 10px">
        <span style="width: 78px; flex: none; font-size: 13px; color: #5b6578">{{c.k}}</span>
        <span style="font-size: 14px; line-height: 1.4">{{c.v}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const ln = (rows) => rows.map((r, i) => Object.assign({ line: i ? '1px solid #eef1f6' : '0' }, r));
    return {
      questions: [
        { from: 'Angel, foreman', when: '7:42 am', text: 'Tomas did not show for the tile. Rebook him or move the crew to framing?', act: 'Call Angel' },
        { from: 'Angel, foreman', when: '9:15 am', text: 'Need 25 GWB and cement board for Tuesday 9/8. Is it ordered?', act: 'Open the Order' }
      ],
      today: ln([
        { k: 'Crew', v: 'Angel, Alberto, Alex · 7:00 to 3:30' },
        { k: 'Progress', v: 'Framing and blocking, 3rd floor; demo and subfloor prep' },
        { k: 'Photos', v: '4 today' },
        { k: 'Problems', v: 'Tile sub no-show, rebooked Fri' }
      ]),
      coming: ln([
        { k: 'Tue 9/8', v: 'DOB plumbing inspection (existing)' },
        { k: 'Fri 9/11', v: 'Insulation, GWB and cement board on site' },
        { k: 'Wed 9/16', v: 'Radiant heat mats, primary bath' }
      ])
    };
  }
}
</script>
</body>
</html>
