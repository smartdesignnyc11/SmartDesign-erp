<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop Messages: Proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 1440px; min-height: 1000px; box-sizing: border-box; display: flex; background: #f4f6fa; color: #172033">

  <nav aria-label="Main" style="width: 248px; flex: none; background: #111a2e; color: #e5e9f2; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: #1b2640; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">S</div>
      <b style="font-size: 16px">SmartDesigns</b>
    </div>
    <div style="flex: 1; padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="padding: 8px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97b0">Your Day</div>
      <sc-for list="{{rail.top}}" as="it" hint-placeholder-count="3">
        <a href="{{it.href}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; color: #e5e9f2; text-decoration: none; font-size: 15px; background: {{it.bg}}; font-weight: {{it.fw}}">
          <span style="flex: 1">{{it.label}}</span>
          <sc-if value="{{it.has}}" hint-placeholder-val="{{true}}"><span style="min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #dc2626; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.n}}</span></sc-if>
        </a>
      </sc-for>
      <div style="padding: 12px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97b0">Work</div>
      <sc-for list="{{rail.work}}" as="w" hint-placeholder-count="6">
        <a href="#" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; color: #e5e9f2; text-decoration: none; font-size: 15px">{{w}}</a>
      </sc-for>
    </div>
    <div style="border-top: 1px solid #2a3550; padding: 8px; display: flex; flex-direction: column">
      <a href="../company/Company.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; color: #c5cde0; text-decoration: none; font-size: 14px">Company and Settings</a>
    </div>
  </nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <div style="background: #fff; border-bottom: 1px solid #dfe4ee; padding: 18px 32px 14px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <b style="font-size: 26px">Messages</b>
          <span style="font-size: 14px; color: #5b6578">{{headLine}}</span>
        </div>
        <label style="height: 40px; width: 280px; padding: 0 12px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; display: flex; align-items: center; gap: 8px; color: #5b6578; font-size: 14px">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
          <input type="search" placeholder="Search people, jobs, words" aria-label="Search messages" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 14px; color: #172033; background: transparent">
        </label>
        <button type="button" aria-label="New message" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; color: #172033; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New Message
        </button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">{{c.label}}<span style="font-weight: 700">{{c.n}}</span></button>
        </sc-for>
        <span style="flex: 1; font-size: 13px; color: #5b6578; text-align: right">{{lead}}</span>
      </div>
    </div>

    <div style="padding: 20px 32px 32px; display: flex; gap: 20px; align-items: flex-start">
      <section aria-label="Conversations" style="width: 470px; flex: none; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <button type="button" onClick="{{r.open}}" aria-pressed="{{r.pressed}}" style="width: 100%; text-align: left; border: 0; border-top: {{r.line}}; border-left: 3px solid {{r.mark}}; background: {{r.bg}}; padding: 12px 16px 12px 13px; display: flex; gap: 12px; font: inherit; color: #172033; cursor: pointer">
            <span style="width: 32px; height: 32px; flex: none; border-radius: 16px; background: #eef1f6; display: flex; align-items: center; justify-content: center; color: #344055">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="display: flex; gap: 8px; align-items: baseline"><b style="flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap" title="{{r.who}}">{{r.who}}</b><span style="font-size: 12px; font-weight: 700; color: {{r.tone}}; white-space: nowrap">{{r.when}}</span></span>
              <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap" title="{{r.subj}}">{{r.kind}} · {{r.subj}}</span>
              <span style="font-size: 13px; color: #5b6578; overflow: hidden; text-overflow: ellipsis; white-space: nowrap" title="{{r.snip}}">{{r.snip}}</span>
              <span style="font-size: 12px; color: {{r.tagTone}}; line-height: 1.35">{{r.tag}}</span>
            </span>
          </button>
        </sc-for>
      </section>

      <section aria-label="The open conversation" style="flex: 1; min-width: 0; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
        <div style="padding: 16px 20px; border-bottom: 1px solid #eef1f6; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 700; color: {{cur.tone}}">{{cur.kicker}}</span>
          <b style="font-size: 19px; line-height: 1.3">{{cur.subj}}</b>
          <span style="font-size: 14px; color: #5b6578">{{cur.who}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px">
            <sc-for list="{{cur.links}}" as="l" hint-placeholder-count="2">
              <a href="{{l.href}}" style="display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 16px; background: #eef2ff; color: #1d4ed8; font-size: 13px; font-weight: 600; text-decoration: none">{{l.label}}</a>
            </sc-for>
          </div>
        </div>
        <div style="padding: 8px 20px 4px; display: flex; flex-direction: column">
          <sc-for list="{{cur.thread}}" as="m" hint-placeholder-count="2">
            <div style="padding: 12px 0; border-top: {{m.line}}; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 13px; color: #5b6578"><b style="color: #172033">{{m.from}}</b> · {{m.at}}</span>
              <span style="font-size: 14px; line-height: 1.55">{{m.text}}</span>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{cur.hasDraft}}" hint-placeholder-val="{{true}}">
          <div style="margin: 8px 20px 0; background: #f8fafc; border: 1px solid #dfe4ee; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; font-weight: 700; color: #5b6578">{{cur.draftLabel}}</span>
            <span style="font-size: 14px; line-height: 1.55">{{cur.draft}}</span>
          </div>
        </sc-if>
        <sc-if value="{{cur.hasWhy}}" hint-placeholder-val="{{true}}">
          <span style="margin: 10px 20px 0; font-size: 13px; color: #5b6578; line-height: 1.45">{{cur.why}}</span>
        </sc-if>
        <div style="padding: 16px 20px 20px; display: flex; gap: 10px; flex-wrap: wrap">
          <sc-for list="{{cur.acts}}" as="a" hint-placeholder-count="3">
            <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: {{a.border}}; background: {{a.bg}}; color: {{a.color}}; font: inherit; font-size: 15px; font-weight: {{a.fw}}">{{a.label}}</button>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'answer', sel: 0 }; }
  renderVals() {
    const I = {
      mail: 'M4 6h16v12H4zM4 7l8 6 8-6',
      call: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',
      chat: 'M4 5h16v11H8l-4 4z',
      text: 'M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2',
      meet: 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6'
    };
    const RED = '#b91c1c', MUTE = '#5b6578', INK = '#172033';
    const job121 = { label: '121 State Street', href: '../job-structure/Job.dc.html' }, kleins = { label: 'The Kleins', href: '../sales/DeskClient.dc.html' };
    // One list: mail, texts, calls, team and client chats, meeting notes. `answer` marks what waits on you (the one rule: a question to you, no reply).
    const ALL = [
      { id: 'aliya', answer: true, icon: I.mail, kind: 'Mail', who: 'Aliya Chen', date: '8/30', when: '4 days', subj: 'Re: Work Complete, 374 Washington Avenue', snip: '“With all due respect, are you kidding me? This is literally what we hired you all to do…”',
        tag: 'Client mail to Jeanette, who has no login yet, so it is yours · past the 2-hour acknowledgement', links: [{ label: '374 Washington Avenue · no client on file', href: '../sales/Clients.dc.html' }],
        thread: [{ from: 'Aliya Chen', at: 'Sun 8/30, 6:12 pm, to Jeanette', text: 'With all due respect, are you kidding me? This is literally what we hired you all to do. [THE REST OF HER MAIL, NOT READ FOR THE MOCK]' }],
        draftLabel: 'Drafted by your assistant from the Standard’s client acknowledgement · nothing is sent until you press Send',
        draft: 'Aliya, I am sorry you waited four days for an answer. I have read your note about 374 Washington Avenue, and I will call you today before 5 pm to go through it with you.',
        why: 'She is not on file as a client, so the build cannot link her job; Add Her as a Client sits on the Clients page.', acts: ['Send Reply', 'Edit the Draft', 'Hand to Someone'] },
      { id: 'samantha', answer: true, icon: I.mail, kind: 'Mail', who: 'Samantha Field', date: '8/31', when: '3 days', subj: '118 E 60th apt 31G: next steps', snip: '“Great speaking with you today. Attached is the alteration agreement for the building.”',
        tag: 'New prospect · meeting today 1:30 pm · no lead on file', links: [{ label: 'No lead on file: New Lead from This Mail', href: '../sales/DeskPipeline.dc.html' }],
        thread: [{ from: 'Samantha Field', at: 'Mon 8/31, 4:40 pm', text: 'Great speaking with you today. Attached is the alteration agreement for the building. Thursday at 1:30 in the lobby works for me.' }],
        draftLabel: 'Drafted by your assistant · nothing is sent until you press Send',
        draft: 'Samantha, thank you for the alteration agreement. Confirming Thursday at 1:30 pm in the lobby at 118 E 60th Street. I will bring our questions on the building’s work rules.',
        why: 'Send Reply also holds 1:30 pm on your calendar and makes the lead from her mail, with the agreement filed to it.', acts: ['Send Reply', 'Edit the Draft', 'New Lead Only'] },
      { id: 'jeanette', answer: true, icon: I.mail, kind: 'Mail', who: 'Jeanette Hernandez', date: '8/31', when: '3 days', subj: 'Re: New client proposals signed', snip: 'Asks whether to bill 344 or 464 hours of design services.',
        tag: 'From the team · needs your number', links: [{ label: 'Design hours to bill', href: '#' }],
        thread: [{ from: 'Jeanette Hernandez', at: 'Mon 8/31, 11:05 am', text: 'Should I bill 344 or 464 hours of design services on the new proposals? [WHICH CLIENTS, NOT READ FOR THE MOCK]' }],
        draftLabel: '', draft: '', why: 'No draft: this needs your number. The records show [HOURS LOGGED] logged design hours against [HOURS IN THE PROPOSALS] in the signed proposals.', acts: ['Reply', 'Open the Hours'] },
      { id: 'klein', answer: true, icon: I.mail, kind: 'Mail', who: 'Sarah Klein', date: '9/2', when: '1 day', subj: 'Fwd: 121 State St alteration agreement', snip: 'The managing agent sent the building’s alteration agreement; they also need a COI and a detailed scope of work.',
        tag: '121 State Street · the Kleins · past the 2-hour acknowledgement · attachment not read yet', links: [job121, kleins],
        thread: [{ from: 'Sarah Klein', at: 'Wed 9/2, 9:18 am', text: 'Forwarding from Halstead. They also need a COI and a detailed scope of work before they sign off. Can you send those?' }],
        draftLabel: 'Drafted by your assistant · the COI and scope are attached from the job’s records · nothing is sent until you press Send',
        draft: 'Sarah, thank you. Attached are our certificate of insurance naming the building and the scope of work from the signed contract. We will send the signed alteration agreement to Halstead by Friday.',
        why: 'The PM, Alan, is copied: 121 State Street is his job.', acts: ['Send Reply', 'Edit the Draft', 'Hand to Alan'] },
      { id: 'torres', answer: true, icon: I.call, kind: 'Call', who: 'R. Torres, Halstead Management', date: '9/2', when: '1 day', subj: 'Elevator booking for Friday’s millwork delivery', snip: 'Called 9/2 about booking the service elevator for the millwork delivery on Friday; not transferred.',
        tag: '121 State Street · the Kleins’ managing agent (the answering service logged him as a client) · the delivery is tomorrow', links: [job121, kleins],
        thread: [{ from: 'Answering service', at: 'Wed 9/2, 3:51 pm', text: 'R. Torres from Halstead Management called about the service elevator booking for Friday’s millwork delivery at 121 State Street. Asked for a call back. Not transferred.' }],
        draftLabel: '', draft: '', why: 'No call back is logged, and Friday’s millwork delivery needs the elevator. The PM, Alan, can take it: Hand to Alan.', acts: ['Call Back', 'Hand to Alan', 'Log a Call'] },
      { id: 'site', answer: false, icon: I.chat, kind: 'Team chat', who: 'Site Leads (Alan, Chen, Angel)', date: '9/3', when: '7:31 am', subj: 'Rough electric walk at 121 State is at 10:00 tomorrow', snip: 'Angel: “Will do. The electrician is on site from 8.”', tag: 'Answered', links: [job121],
        thread: [{ from: 'Alan', at: '7:20 am', text: 'Rough electric walk at 121 State is at 10:00 tomorrow. Angel, have the panel cover off.' }, { from: 'Angel', at: '7:31 am', text: 'Will do. The electrician is on site from 8.' }], draftLabel: '', draft: '', why: '', acts: ['Reply'] },
      { id: 'mark', answer: false, icon: I.mail, kind: 'Mail', who: 'Mark Hyland', date: '9/1', when: '9/1', subj: 'Re: 47 West 76th St Apt 3, ceiling repair', snip: '“Money just sent.”', tag: 'Routed to billing', links: [{ label: 'Billing’s Messages', href: '#' }],
        thread: [{ from: 'Mark Hyland', at: 'Tue 9/1', text: 'Money just sent.' }], draftLabel: '', draft: '', why: 'Billing matches it to the bank line.', acts: ['Open'] },
      { id: 'nemo', answer: false, icon: I.mail, kind: 'Mail', who: 'Nemo Tile accounts', date: '9/1', when: '9/1', subj: 'Statement: SmartDesign Group LLC', snip: '1 invoice outstanding, $2,140, due September 30.', tag: 'Routed to the controller', links: [{ label: 'Nemo Tile', href: '../purchasing/Vendors.dc.html' }],
        thread: [{ from: 'Nemo Tile accounts', at: 'Tue 9/1', text: 'Statement attached: 1 invoice outstanding, $2,140, due September 30.' }], draftLabel: '', draft: '', why: '', acts: ['Open'] },
      { id: 'luis', answer: false, icon: I.text, kind: 'Text', who: 'Luis, super at 121 State', date: '8/29', when: '8/29', subj: 'No deliveries Saturday', snip: '“No deliveries Saturday, board rule. Monday 9am is fine, use the service entrance.”', tag: 'Filed to the building’s rules', links: [job121],
        thread: [{ from: 'Luis', at: 'Sat 8/29', text: 'No deliveries Saturday, board rule. Monday 9am is fine, use the service entrance.' }], draftLabel: '', draft: '', why: '', acts: ['Reply'] },
      { id: 'catchup', answer: false, meet: true, icon: I.meet, kind: 'Meeting notes', who: 'Team Catch Up', date: '8/28', when: '8/28', subj: 'Notes from Gemini, to review', snip: 'The hall light fixture at 121 State cannot be replaced next week; now expected mid-September.', tag: 'Alan reviews: 121 State Street is his job', links: [job121],
        thread: [{ from: 'Meeting notes', at: 'Fri 8/28', text: 'The hall light fixture at 121 State cannot be replaced next week; now expected mid-September. [THE OTHER NEXT STEPS, IN THE NOTES]' }], draftLabel: '', draft: '', why: 'Alan approves the next steps; each goes to Tasks with its owner. Nothing here waits on you.', acts: ['Open the Notes'] },
      { id: 'sched', answer: false, meet: true, icon: I.meet, kind: 'Meeting notes', who: '121 State St: Schedule Review', date: '8/17', when: '8/17', subj: 'Notes from Gemini, to review', snip: 'The team aligned on the construction sequence for the garden unit and how inspections are booked.', tag: 'Alan reviews: 121 State Street is his job', links: [job121],
        thread: [{ from: 'Meeting notes', at: 'Mon 8/17', text: 'The team aligned on the construction sequence for the garden unit and how inspections are booked.' }], draftLabel: '', draft: '', why: 'Alan approves the next steps; each goes to Tasks with its owner.', acts: ['Open the Notes'] }
    ];
    const S = this.state, T = S.tab;
    const key = (r) => r.date.split('/').map((x) => ('0' + x).slice(-2)).join('');
    const answer = ALL.filter((r) => r.answer).sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);
    const all = ALL.slice().sort((a, b) => key(a) < key(b) ? 1 : key(a) > key(b) ? -1 : 0);
    const meet = ALL.filter((r) => r.meet);
    const L = { answer, all, meet }[T];
    const sel = Math.min(S.sel, L.length - 1);
    const rows = L.map((r, i) => Object.assign({}, r, {
      line: i ? '1px solid #eef1f6' : '0', pressed: i === sel ? 'true' : 'false', bg: i === sel ? '#eff6ff' : '#fff', mark: i === sel ? '#2563eb' : 'transparent',
      tone: r.answer ? RED : MUTE, tagTone: r.answer ? '#7f1d1d' : MUTE, open: () => this.setState({ sel: i })
    }));
    const c = L[sel];
    const acts = c.acts.map((a, i) => {
      const blue = i === 0 && c.answer; // one blue: the reply to what waits on you, never on an answered thread
      return { label: a, bg: blue ? '#2563eb' : '#fff', color: blue ? '#fff' : INK, border: blue ? '0' : '1px solid #c9d1e0', fw: blue ? '700' : '600' };
    });
    const cur = Object.assign({}, c, {
      kicker: (c.kind + ' · ' + (c.answer ? 'waiting on you ' + c.when : c.date)).toUpperCase(), tone: c.answer ? RED : MUTE,
      thread: c.thread.map((m, i) => Object.assign({ line: i ? '1px solid #eef1f6' : '0' }, m)), hasDraft: !!c.draft, hasWhy: !!c.why, acts
    });
    const defs = [{ id: 'answer', label: 'Needs an Answer', n: answer.length }, { id: 'all', label: 'All', n: '' }, { id: 'meet', label: 'Meetings', n: '' }];
    const chips = defs.map((d) => Object.assign({}, d, {
      pressed: T === d.id ? 'true' : 'false', bg: T === d.id ? '#172033' : '#fff', color: T === d.id ? '#fff' : INK, border: T === d.id ? '#172033' : '#c9d1e0',
      pick: () => this.setState({ tab: d.id, sel: 0 })
    }));
    const lead = { answer: 'Waiting on you, oldest first. A client message counts from the minute it arrives.', all: 'Everything you may read, newest first: mail, texts, calls, chats and meeting notes.', meet: 'Meeting notes. Each job’s PM reviews them; nothing here waits on you.' }[T];
    const headLine = answer.length + ' need an answer from you · the same ' + answer.length + ' are rows on Today';
    const rail = {
      top: [{ label: 'Today', n: 16, has: true, bg: 'transparent', fw: '500', href: 'DeskToday.dc.html' }, { label: 'Tasks', n: 0, has: false, bg: 'transparent', fw: '500', href: 'DeskTasks.dc.html' }, { label: 'Messages', n: answer.length, has: true, bg: '#22304d', fw: '700', href: 'DeskMessages.dc.html' }],
      work: ['Projects', 'Purchasing', 'Sales and Clients', 'Accounting', 'Design', 'Reports']
    };
    return { rail, chips, rows, cur, lead, headLine };
  }
}
</script>
