<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu: Accounting and Reports by Role</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#93c5fd}a:hover{color:#bfdbfe}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #111a2e; color: #e5e9f2; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px">
    <div style="width: 32px; height: 32px; border-radius: 8px; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700">S</div>
    <div style="display: flex; flex-direction: column"><b style="font-size: 16px">SmartDesigns</b><span style="font-size: 12px; color: #9aa6bd">Signed in as {{who}}</span></div>
  </div>
  <div style="padding: 0 16px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97b0">Mock-up only: see the menu as</div>
  <div style="display: flex; gap: 6px; margin: 0 16px 12px; flex-wrap: wrap">
    <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
      <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #2a3550; background: {{r.bg}}; color: #fff; font: inherit; font-size: 13px; font-weight: 600">{{r.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px">
    <div style="padding: 8px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97b0">Your Day</div>
    <sc-for list="{{top}}" as="it" hint-placeholder-count="3">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; color: #e5e9f2; text-decoration: none">
        <span style="width: 20px; height: 20px; display: flex; color: #c5cde0" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg></span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">{{it.label}}</span>
        <sc-if value="{{it.hasCount}}" hint-placeholder-val="{{true}}"><span style="min-width: 24px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; background: #dc2626; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.count}}</span></sc-if>
      </a>
    </sc-for>
    <div style="padding: 14px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97b0">Work</div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column">
        <button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.expanded}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: {{g.bg}}; color: #e5e9f2; font: inherit; text-align: left; cursor: pointer">
          <span style="width: 20px; height: 20px; display: flex; color: #c5cde0" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg></span>
          <span style="flex: 1; font-size: 16px; font-weight: 600">{{g.label}}</span>
        </button>
        <sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; padding: 2px 0 6px 44px">
            <sc-for list="{{g.items}}" as="s" hint-placeholder-count="4">
              <a href="{{s.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #d6dcea; text-decoration: none; font-size: 15px">
                <span style="flex: 1">{{s.label}}</span>
                <sc-if value="{{s.hasCount}}" hint-placeholder-val="{{false}}"><span style="min-width: 24px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; background: #dc2626; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{s.count}}</span></sc-if>
              </a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="border-top: 1px solid #2a3550; padding: 8px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #c5cde0; text-decoration: none; font-size: 15px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4.4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"></path></svg>
      Company and Settings
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { role: 'Controller', open: 'Accounting' }; }
  renderVals() {
    const I = {
      today: 'M3 10h18M7 3v4M17 3v4M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z',
      tasks: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
      msg: 'M4 5h16v11H8l-4 4z',
      proj: 'M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6',
      buy: 'M3 4h2l2.5 11h11L21 7H7M9 20a1 1 0 1 0 0-.1M18 20a1 1 0 1 0 0-.1',
      sales: 'M3 17l6-6 4 4 8-8M15 7h6v6',
      acct: 'M4 6h16v12H4zM4 10h16M8 15h3',
      design: 'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3',
      rep: 'M5 20V10M12 20V4M19 20v-7'
    };
    const it = (label, href, count) => ({ label, href: href || '#', count: count || '', hasCount: !!count });
    const A = {
      billing: (c) => it('Billing', 'Billing.dc.html', c), banking: (c) => it('Banking', 'Banking.dc.html', c),
      bills: (c) => it('Bills and Payroll', 'BillsPayroll.dc.html', c), books: (c) => it('Books', 'Books.dc.html', c),
      jp: it('Job Profitability', '../reports/JobProfit.dc.html'), cash: it('Cash', '../reports/Cash.dc.html'),
      fs: it('Financial Statements', '../reports/Statements.dc.html'), rb: it('Report Builder', '../reports/Builder.dc.html')
    };
    const roles = {
      'Controller': { who: 'Controller', today: '2', tasks: '1', msgs: '1', groups: [
        ['Projects', I.proj, [it('All Projects')]], ['Purchasing', I.buy, [it('Orders'), it('Vendors')]],
        ['Accounting', I.acct, [A.billing(), A.banking('15'), A.bills('4'), A.books('4')]],
        ['Reports', I.rep, [A.jp, A.cash, A.fs, A.rb]] ] },
      'Billing': { who: 'Billing', today: '1', tasks: '', msgs: '1', groups: [
        ['Projects', I.proj, [it('All Projects')]], ['Sales and Clients', I.sales, [it('Estimates'), it('Clients')]],
        ['Accounting', I.acct, [A.billing('4'), A.banking()]],
        ['Reports', I.rep, [A.jp, A.cash, A.rb]] ] },
      'Owner': { who: 'Alan · Owner', today: '16', tasks: '', msgs: '5', groups: [
        ['Projects', I.proj, [it('121 State Street'), it('206 Lenox'), it('All Projects')]], ['Purchasing', I.buy, [it('Buy Board'), it('Orders')]],
        ['Sales and Clients', I.sales, [it('Pipeline'), it('Estimates'), it('Clients')]],
        ['Accounting', I.acct, [A.billing(), A.banking(), A.bills()]],
        ['Design', I.design, [it('Selections'), it('Drawings')]],
        ['Reports', I.rep, [A.jp, A.cash, A.fs, A.rb]] ] },
      'PM': { who: 'Alan · Project Manager', today: '4', tasks: '5', msgs: '3', groups: [
        ['Projects', I.proj, [it('121 State Street'), it('All Projects')]], ['Purchasing', I.buy, [it('Buy Board'), it('Orders')]],
        ['Sales and Clients', I.sales, [it('Estimates'), it('Clients')]],
        ['Reports', I.rep, [A.jp, A.rb]] ] }
    };
    const R = roles[this.state.role];
    const top = [
      { label: 'Today', icon: I.today, count: R.today, hasCount: !!R.today },
      { label: 'Tasks', icon: I.tasks, count: R.tasks, hasCount: !!R.tasks },
      { label: 'Messages', icon: I.msg, count: R.msgs, hasCount: !!R.msgs }
    ];
    const groups = R.groups.map(([label, icon, items]) => {
      const open = this.state.open === label;
      return { label, icon, items, open, expanded: open ? 'true' : 'false', bg: open ? '#1b2640' : 'transparent', toggle: () => this.setState({ open: open ? '' : label }) };
    });
    const roleChips = Object.keys(roles).map((k) => ({ label: k, on: k === this.state.role ? 'true' : 'false', bg: k === this.state.role ? '#2a3550' : 'transparent', pick: () => this.setState({ role: k, open: k === 'PM' ? 'Reports' : 'Accounting' }) }));
    return { who: R.who, roles: roleChips, top, groups };
  }
}
</script>
</body>
</html>
