<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team: Proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; min-height: 1100px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Company.dc.html" aria-label="Back to Company and Settings" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <b style="flex: 1; font-size: 19px">Team</b>
      <button type="button" aria-label="New person" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a4866; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">13 on file, plus Alan · tap a person for their work, limits and assistant</span>
  </div>

  <div style="margin: 16px 16px 0; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; color: #b91c1c">NEEDS YOU</span>
    <span style="font-size: 14px; line-height: 1.45">Alan, the PM, has no entry on the Team page, so nobody can pick him as a task’s owner or see his phone. Five people have no phone or email on file.</span>
    <button type="button" style="min-height: 48px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; font: inherit; font-size: 15px; font-weight: 700">Add Alan to the Team</button>
  </div>

  <div style="padding: 16px 16px 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #5b6578">Most Loaded First</div>
  <div style="margin: 0 16px 24px; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="13">
      <a href="{{p.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; border-top: {{p.line}}; text-decoration: none; color: #172033">
        <span style="width: 36px; height: 36px; flex: none; border-radius: 18px; background: #e8ecf4; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #5b6578; line-height: 1.35">{{p.role}}</span></span>
        <span style="font-size: 13px; font-weight: 600; color: {{p.tone}}; text-align: right; max-width: 110px">{{p.load}}</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8a94a8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const RED = '#b91c1c', MUTE = '#5b6578';
    const P = [
      ['O', 'Owner (you)', 'Owner / CEO · (917) 555-0100', '15 open, 3 late', RED, 'Person.dc.html'],
      ['A', 'Alan', 'Project manager · not on the Team page yet', '10 open', RED, '#'],
      ['CB', 'Chen Biron', 'Coordinator · (917) 555-0102', '9 open', MUTE, '#'],
      ['DD', 'Design director', 'Design · no phone or email on file', '7 open, 1 late', RED, '#'],
      ['A', 'Alberto', 'Framing and plumbing · (917) 555-0105', '5 open · 26 h', MUTE, '#'],
      ['A', 'Angel', 'Site lead · (917) 555-0104', '3 open · 24 h', MUTE, '#'],
      ['S', 'Satish', 'Electrician · no email on file', '1 open · 6 h', MUTE, '#'],
      ['SD', 'Sarah Davis', 'Architect · (917) 555-0108', '1 open · 13 h', MUTE, '#'],
      ['C', 'Controller', 'Controller · (917) 555-0105', '1 open', MUTE, '#'],
      ['B', 'Billing', 'Billing · (917) 555-0104', '', MUTE, '#'],
      ['A', 'Alex', 'Helper · (917) 555-0103', '', MUTE, '#'],
      ['J', 'Jeanette', 'Office and purchasing · no login, phone or email', 'Client mail to her reaches you', RED, '#'],
      ['M', 'Maya', 'Architect · no phone or email on file', '', MUTE, '#'],
      ['L', 'Lena', 'Designer · no phone or email on file', '', MUTE, '#']
    ];
    const people = P.map((x, i) => ({ ini: x[0], name: x[1], role: x[2], load: x[3], tone: x[4], href: x[5], line: i ? '1px solid #eef1f6' : '0' }));
    return { people };
  }
}
</script>
</body>
</html>
