<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insurance and Licences: Proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
</style>
</helmet>
<div style="width: 390px; min-height: 1150px; box-sizing: border-box; background: #f4f6fa; color: #172033; display: flex; flex-direction: column">
  <div style="background: #111a2e; color: #fff; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Company.dc.html" aria-label="Back to Company and Settings" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <b style="flex: 1; font-size: 19px">Insurance and Licences</b>
      <button type="button" aria-label="New policy, licence or filing" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #3a4866; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <span style="font-size: 13px; color: #b9c3d8">The firm’s own policies, licences and filings · renewals reach Today 30 days ahead</span>
  </div>

  <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column">
      <div style="padding: 16px 16px 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: {{s.tone}}; display: flex; gap: 6px"><span>{{s.title}}</span><span>{{s.n}}</span></div>
      <div style="margin: 0 16px; background: #fff; border: 1px solid #dfe4ee; border-radius: 12px; overflow: hidden">
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <div style="padding: 12px 14px; border-top: {{r.line}}; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; gap: 10px; align-items: baseline">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><b style="font-size: 15px; line-height: 1.35">{{r.k}}</b><span style="font-size: 13px; color: #5b6578; line-height: 1.4">{{r.sub}}</span></span>
              <span style="font-size: 13px; font-weight: 700; color: {{r.tone}}; text-align: right">{{r.v}}</span>
            </div>
            <sc-if value="{{r.primary}}" hint-placeholder-val="{{false}}"><button type="button" style="min-height: 48px; border-radius: 10px; border: 0; background: #2563eb; color: #fff; font: inherit; font-size: 15px; font-weight: 700">{{r.act}}</button></sc-if>
            <sc-if value="{{r.side}}" hint-placeholder-val="{{false}}"><div style="display: flex"><button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #c9d1e0; background: #fff; color: #172033; font: inherit; font-size: 14px; font-weight: 600">{{r.act}}</button></div></sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
  <div style="height: 24px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const RED = '#b91c1c', MUTE = '#5b6578', INK = '#172033';
    const S = [
      { title: 'Needs You', n: 2, tone: RED, rows: [
        { k: 'LLC biennial statement, SmartDesign Group LLC', sub: 'NYS Department of State · the filing was due 8/29', v: 'Lapses 9/28', tone: RED, act: 'Draft the Renewal', primary: true },
        { k: 'Home improvement contractor licence', sub: 'The licence number is blank, and it prints on every estimate and invoice; a NYC home-improvement contract needs it', v: 'Missing', tone: RED, act: 'Add the Licence', side: true }
      ] },
      { title: 'On File', n: 2, tone: MUTE, rows: [
        { k: 'General liability · GL-4471-2026', sub: 'Hartford · the company', v: '5 months', tone: INK },
        { k: 'Builder’s risk · BR-91022', sub: 'Zurich · 121 State Street', v: '6 months', tone: INK }
      ] },
      { title: 'Not on File Yet', n: '', tone: MUTE, rows: [
        { k: 'Workers’ compensation and disability', sub: 'Required for a crew on payroll: [PLACEHOLDER] policy and dates', v: 'None', tone: MUTE, act: 'Add', side: true },
        { k: 'DOB and trade licences (plumbing, electric)', sub: 'SD Plumbing LLC and SD Electric LLC: [PLACEHOLDER] numbers and dates', v: 'None', tone: MUTE, act: 'Add', side: true }
      ] },
      { title: 'Kept With Their Record', n: '', tone: MUTE, rows: [
        { k: 'Vendors’ insurance certificates', sub: 'Window Works lapsed 8/15 · Tino has an open PO and none on file · 4 current. Each lives on its vendor; the coordinator chases.', v: 'Purchasing', tone: MUTE, act: 'Open Vendors', side: true },
        { k: 'Permits and warranties', sub: 'The 121 State Street plumbing permit and the window warranty (10 years) live in that job’s Documents', v: 'The job', tone: MUTE, act: 'Open the Job', side: true }
      ] }
    ];
    const sections = S.map((s) => Object.assign({}, s, { rows: s.rows.map((r, i) => Object.assign({ act: '', primary: false, side: false }, r, { line: i ? '1px solid #eef1f6' : '0' })) }));
    return { sections };
  }
}
</script>
</body>
</html>
